```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusHub - Profile</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar">

            <div class="logo">
                CampusHub
            </div>

            <nav>

                <a href="dashboard.html">
                    🏠 Dashboard
                </a>

                <a href="profile.html" class="active">
                    👤 Profile
                </a>

                <a href="subjects.html">
    📚 Subjects
</a>

                <a href="attendance.html">
    📊 Attendance
</a>

                <a href="marks.html">
    📝 Marks
</a>

                <a href="jobs.html">
    💼 Jobs
</a>
                <a href="applications.html">
    📄 Applications
</a>

                <a href="notifications.html">
    🔔 Notifications
</a>

            </nav>

            <button id="logoutBtn" class="logout-btn">
                Logout
            </button>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <header class="topbar">

                <div>
                    <h1>My Profile</h1>

                    <p>
                        View and update your student information
                    </p>
                </div>

                <div class="profile-badge">
                    Student
                </div>

            </header>


            <!-- Loading -->
            <div id="loading">
                Loading profile...
            </div>


            <!-- Profile -->
            <section id="profileContent" class="dashboard-card" style="display:none;">

                <form id="profileForm">

                    <div class="profile-form-grid">

                        <div class="form-group">
                            <label>Name</label>

                            <input type="text" id="name" readonly>
                        </div>


                        <div class="form-group">
                            <label>Email</label>

                            <input type="email" id="email" readonly>
                        </div>


                        <div class="form-group">
                            <label>Enrollment Number</label>

                            <input type="text" id="enrollment_no" readonly>
                        </div>


                        <div class="form-group">
                            <label>Department</label>

                            <input type="text" id="department" readonly>
                        </div>


                        <div class="form-group">
                            <label>Semester</label>

                            <input type="number" id="semester" min="1" max="8" required>
                        </div>


                        <div class="form-group">
                            <label>CGPA</label>

                            <input type="number" id="cgpa" min="0" max="10" step="0.01" required>
                        </div>


                        <div class="form-group">
                            <label>Phone</label>

                            <input type="text" id="phone" maxlength="15">
                        </div>

                    </div>


                    <button type="submit" class="btn profile-save-btn">
                        Save Changes
                    </button>

                </form>


                <p id="message" class="message"></p>

            </section>

        </main>

    </div>


    <script src="js/profile.js"></script>

</body>

</html>
```
